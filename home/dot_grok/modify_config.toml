{{- /* chezmoi:modify-template */ -}}
{{- /* Grok rewrites this file itself, so chezmoi only enforces a few keys and keeps the rest. No secrets here. */ -}}
{{- $cur := dict -}}
{{- if .chezmoi.stdin }}{{ $cur = fromToml .chezmoi.stdin }}{{ end -}}
{{- $cli := get $cur "cli" | default dict -}}
{{- $_ := set $cli "use_leader" true -}}
{{- $_ := set $cli "auto_update" (ne .role "phone") -}}
{{- $_ := set $cur "cli" $cli -}}
{{- $mk := get $cur "marketplace" | default dict -}}
{{- if not (hasKey $mk "sources") -}}
{{-   $_ := set $mk "sources" (list (dict "name" "xAI Official" "git" "https://github.com/xai-org/plugin-marketplace.git")) -}}
{{- end -}}
{{- $_ := set $cur "marketplace" $mk -}}
{{- $ui := get $cur "ui" | default dict -}}
{{- if not (hasKey $ui "permission_mode") }}{{ $_ := set $ui "permission_mode" "auto" }}{{ end -}}
{{- $_ := set $cur "ui" $ui -}}
{{- /* Hindsight memory MCP: key read at apply time from an untracked file, never committed */ -}}
{{- $mcp := get $cur "mcp_servers" | default dict -}}
{{- $keyf := joinPath .chezmoi.homeDir ".config/hindsight/api_key" -}}
{{- if stat $keyf -}}
{{-   $hs := get $mcp "hindsight" | default dict -}}
{{-   $_ := unset $hs "bearer_token_file" -}}
{{-   $_ := set $hs "url" "https://api.hindsight.vectorize.io/mcp/personal/" -}}
{{-   $_ := set $hs "enabled" true -}}
{{-   $h := get $hs "headers" | default dict -}}
{{-   $_ := set $h "Authorization" (printf "Bearer %s" (include $keyf | trim)) -}}
{{-   $_ := set $hs "headers" $h -}}
{{-   $_ := set $mcp "hindsight" $hs -}}
{{- else if hasKey $mcp "hindsight" -}}
{{-   $hs := get $mcp "hindsight" -}}
{{-   $_ := unset $hs "bearer_token_file" -}}
{{-   $_ := unset $hs "headers" -}}
{{-   $_ := set $hs "enabled" false -}}
{{- end -}}
{{- $_ := set $cur "mcp_servers" $mcp -}}
{{ toToml $cur }}

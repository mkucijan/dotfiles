{{- /* chezmoi:modify-template */ -}}
{{- /* Grok rewrites this file itself, so chezmoi only enforces a few keys and keeps the rest. No secrets here. */ -}}
{{- $cur := dict -}}
{{- if .chezmoi.stdin }}{{ $cur = fromToml .chezmoi.stdin }}{{ end -}}
{{- $cli := get $cur "cli" | default dict -}}
{{- $_ := set $cli "use_leader" true -}}
{{- $_ := set $cli "auto_update" (ne .role "phone") -}}
{{- $_ := set $cur "cli" $cli -}}
{{- $mk := get $cur "marketplace" | default dict -}}
{{- if not (hasKey $mk "sources") -}}
{{-   $_ := set $mk "sources" (list (dict "name" "xAI Official" "git" "https://github.com/xai-org/plugin-marketplace.git")) -}}
{{- end -}}
{{- $_ := set $cur "marketplace" $mk -}}
{{- $ui := get $cur "ui" | default dict -}}
{{- if not (hasKey $ui "permission_mode") }}{{ $_ := set $ui "permission_mode" "auto" }}{{ end -}}
{{- $_ := set $cur "ui" $ui -}}
{{- /* Hindsight memory MCP: token read from an untracked file, never committed */ -}}
{{- $mcp := get $cur "mcp_servers" | default dict -}}
{{- $hs := get $mcp "hindsight" | default (dict "url" "https://api.hindsight.vectorize.io/mcp/personal/" "bearer_token_file" "~/.config/hindsight/api_key") -}}
{{- $_ := set $hs "enabled" (stat (joinPath .chezmoi.homeDir ".config/hindsight/api_key") | not | not) -}}
{{- $_ := set $mcp "hindsight" $hs -}}
{{- /* gcloud MCP: local stdio wrapper puts google-cloud-sdk on PATH */ -}}
{{- $gcloud := get $mcp "gcloud" | default (dict "command" "gcloud-mcp") -}}
{{- $_ := set $gcloud "command" "gcloud-mcp" -}}
{{- $_ := set $gcloud "enabled" true -}}
{{- $_ := set $mcp "gcloud" $gcloud -}}
{{- /* firebase MCP: npx firebase-tools mcp Spark/free needs firebase login */ -}}
{{- $firebase := get $mcp "firebase" | default (dict "command" "npx") -}}
{{- $_ := set $firebase "command" "npx" -}}
{{- $_ := set $firebase "args" (list "-y" "firebase-tools@latest" "mcp") -}}
{{- $_ := set $firebase "enabled" true -}}
{{- $_ := set $mcp "firebase" $firebase -}}
{{- $_ := set $cur "mcp_servers" $mcp -}}
{{ toToml $cur }}

# Starship config: Plain Text Symbols + VS Code Dark+ high-contrast colors
# Browser/SSH-friendly (no Nerd Font glyphs). Regenerate symbols with:
#   starship preset plain-text-symbols
# Colors tuned for near-black terminals (tmux/browser Dark Modern).
#add_newline = false

format = """\
    $username\
    $hostname\
    $kubernetes\
    $directory\
    $git_branch\
    $git_commit\
    $git_state\
    $git_status\
    $hg_branch\
    $docker_context\
    $package\
    $dotnet\
    $elixir\
    $elm\
    $erlang\
    $golang\
    $java\
    $julia\
    $nim\
    $nodejs\
    $ocaml\
    $php\
    $purescript\
    $python\
    $ruby\
    $rust\
    $terraform\
    $zig\
    $nix_shell\
    $conda\
    $memory_usage\
    $aws\
    $env_var\
    $crystal\
    $cmd_duration\
    $custom\
    $line_break\
    $jobs\
    $battery\
    $time\
    $character\
    """

"$schema" = 'https://starship.rs/config-schema.json'

continuation_prompt = "[.](bold #9d9d9d) "

# High-contrast VS Code Dark+ module colors (plain-text symbols kept)
[username]
style_user = "bold #ffffff"
style_root = "bold #f14c4c"
format = "[$user]($style) "
show_always = true

[character]
success_symbol = "[>](bold #23d18b)"
error_symbol = "[x](bold #f14c4c)"
vimcmd_symbol = "[<](bold #23d18b)"
vimcmd_visual_symbol = "[<](bold #f5f543)"
vimcmd_replace_symbol = "[<](bold #d670d6)"
vimcmd_replace_one_symbol = "[<](bold #d670d6)"

[git_commit]
tag_symbol = " tag "

[git_status]
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

[aws]
symbol = "aws "

[azure]
symbol = "az "

[battery]
full_symbol = "full "
charging_symbol = "charging "
discharging_symbol = "discharging "
unknown_symbol = "unknown "
empty_symbol = "empty "

[buf]
symbol = "buf "

[bun]
symbol = "bun "

[c]
symbol = "C "

[cpp]
symbol = "C++ "

[cobol]

# Bitwarden Secrets Manager (bws) -> local targets. Names only, never values.
# `{host}` expands to the chezmoi hostname. `hosts`/`os` (optional) limit an entry.
# Missing secrets are skipped with a one-line notice; `secrets-sync` never fails.

[[secrets.files]]
key  = "hindsight"
path = "~/.config/hindsight/api_key"
mode = "600"

[[secrets.env]]           # exported from ~/.config/secrets/env (0600), sourced by zsh
key = "gh-token"
var = "GH_TOKEN"          # gh honors it; ~/.config/gh/hosts.yml stays untracked

# Scoped per-device IAM keys only (admin user `kuc` stays on arch, outside bws).
[[secrets.aws]]
profile           = "{host}"
access_key_id     = "aws-{host}-access-key-id"
secret_access_key = "aws-{host}-secret-access-key"
region            = "eu-central-1"
